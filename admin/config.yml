backend:
  name: github
  repo: WangYankun/WangYankun.github.io
  branch: main
  # GitHub OAuth 配置 - 需要坤总自行创建 OAuth App 后填写
  # 创建地址：https://github.com/settings/developers
  Authorization callback URL: https://wangyankun.github.io/admin/
  # 创建后填入 client_id:
  client_id: Ov23lil7tzIe9Im4J1Tb

# 发布方式 - 直接提交到 main 分支
publish_mode: simple

# 媒体文件存放路径（相对于仓库根目录）
media_folder: "source/uploads"
public_folder: "/uploads"

# 站点 URL
site_url: https://wangyankun.github.io

# Logo 和主题
logo_url: https://wangyankun.github.io/images/logo.svg

# 文章集合
collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "source/_posts"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "分类", name: "categories", widget: "list", default: [] }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    files:
      - label: "关于"
        name: "about"
        file: "source/about/index.md"
        fields:
          - { label: "标题", name: "title", widget: "hidden", default: "关于我" }
          - { label: "发布日期", name: "date", widget: "hidden", default: "2026-04-27 14:10:00" }
          - { label: "正文", name: "body", widget: "markdown" }
