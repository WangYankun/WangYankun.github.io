<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>博客管理后台</title>
  <style>
    /* ===== 手机端优化 ===== */
    @media (max-width: 768px) {
      /* 防止 iOS 输入时自动放大 */
      input, textarea, select {
        font-size: 16px !important;
        -webkit-text-size-adjust: 100%;
      }

      /* 增大触摸区域 */
      button, [role="button"], a, label, .css-1bmf2h6 {
        min-height: 44px !important;
        min-width: 44px !important;
      }

      /* 正文 Markdown 编辑器加大高度 */
      textarea, .css-h4y409 {
        min-height: 40vh !important;
      }

      /* 去除点击高亮 */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* 内容区占满宽度 */
      [class^="css-"] {
        max-width: 100vw !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.9.0/dist/decap-cms.js"></script>
  <script>
    // 手机运行时动态优化
    (function() {
      if (window.innerWidth > 768) return;
      // CMS 加载完后注入更多手机端样式
      const interval = setInterval(function() {
        var root = document.getElementById('nc-root');
        if (root && root.innerHTML) {
          clearInterval(interval);
          var style = document.createElement('style');
          style.textContent = [
            /* 隐藏侧边栏图标旁边的文字 */
            '[class*="Sidebar"] [class*="NavItem"] span { display: none !important; }',
            '[class*="Sidebar"] [class*="NavItem"] { justify-content: center !important; padding: 12px 0 !important; }',
            /* 编辑器全屏化 */
            '[class*="EditorContainer"], [class*="editorContainer"] { max-width: 100% !important; }',
            /* 列表紧凑 */
            '[class*="Card"], [class*="card"] { margin: 4px 0 !important; }',
            /* 底部操作栏固定 */
            '[class*="Toolbar"], [class*="toolbar"] { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 999 !important; }',
            /* 给底部留空间 */
            'body { padding-bottom: 60px !important; }',
          ].join(' ');
          document.head.appendChild(style);
        }
      }, 200);
      setTimeout(function() { clearInterval(interval); }, 10000);
    })();
  </script>
</body>
</html>
